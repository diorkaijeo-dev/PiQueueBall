<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Match Totals · PiQueueBall</title>
  <link rel="icon" href="assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="offline.js" defer></script>
  <script src="page-transitions.js" defer></script>
  <script src="supabase-config.js" defer></script>
  <script src="supabase-client.js" defer></script>
  <script src="auth-guard.js" defer></script>
  <script src="online-sync.js" defer></script>
  <script src="auth-ui.js" defer></script>
  <script src="history-utils.js" defer></script>
  <script src="tracker-pages.js" defer></script>
</head>
<body>
  <main class="screen queue-screen totals-screen">
    <header class="hero queue-hero">
      <span class="circle c1"></span><span class="circle c2"></span>
      <small>PiQueueBall</small>
      <h1>Match Totals</h1>
      <p>Player stats from completed matches.</p>
    </header>
    <div class="account-bar"><span id="account-email"></span><button id="sign-out" type="button">Sign out</button></div>

    <section class="queue-panel tracker-page-panel" aria-labelledby="stats-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">PLAYER STATISTICS</p>
          <h2 id="stats-title">Played, won, and lost</h2>
        </div>
      </div>
      <div class="stats-table-wrap">
        <table class="stats-table">
          <thead><tr><th scope="col">Player</th><th scope="col">Played</th><th scope="col">Won</th><th scope="col">Lost</th></tr></thead>
          <tbody id="player-stats"></tbody>
        </table>
      </div>
      <p class="tracker-empty" id="empty-stats">Stats will appear after the first completed match.</p>
      <p class="queue-status" id="tracker-status" role="status" aria-live="polite"></p>
    </section>

    <nav class="nav" aria-label="Main">
      <a href="home.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Queue</a>
      <a href="score.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v4a4 4 0 0 1-8 0zM8 6H5v2a4 4 0 0 0 4 4m7-6h3v2a4 4 0 0 1-4 4m-3 0v5m-4 3h8m-7-3h6"/></svg>Scores</a>
      <a class="active" href="totals.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11h4v9m4 0V4h4v16m4 0v-6h4v6M2 20h20"/></svg>Totals</a>
      <a href="results.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h8l4 4v14H5V3zm8 1v4h4m-10 4h8m-8 4h5"/></svg>Results</a>
      <a href="profiles.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profiles</a>
      <a href="friends.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2m6-10a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm7-7.5a4 4 0 0 1 0 7.8M20 15a4 4 0 0 1 2 3.5V21"/></svg>Friends</a>
    </nav>
  </main>
</body>
</html>
