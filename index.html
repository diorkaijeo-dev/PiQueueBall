<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PiQueueBall</title>
  <link rel="icon" href="assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="offline.js" defer></script>
  <script src="page-transitions.js" defer></script>
  <script src="supabase-config.js" defer></script>
  <script src="supabase-client.js" defer></script>
  <script src="auth-guard.js" defer></script>
  <script src="auth-pages.js" defer></script>
</head>
<body>
  <main class="screen green">
    <span class="circle c1"></span><span class="circle c2"></span>
    <span class="circle c3"></span><span class="circle c4"></span>
    <div class="welcome">
      <img src="assets/logo.png" alt="PQB logo">
      <h1>Welcome to PiQueueBall</h1>
      <a class="btn" href="signup.html">Create account</a>
      <a class="welcome-login" href="login.html">Already have an account? Log in</a>
      <a class="welcome-login" href="home.html?offline=1">Continue offline · save on this device</a>
      <p class="queue-status" id="auth-status" role="status" aria-live="polite"></p>
    </div>
  </main>
</body>
</html>
